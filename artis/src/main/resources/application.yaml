spring:
  application:
    name: artis

  # Configuração do Banco de Dados (PostgreSQL)
  datasource:
    # As variáveis abaixo (${...}) são um fallback para quando você rodar local.
    # Quando rodar via Docker Compose, o docker vai injetar essas variáveis automaticamente.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/certamen_artis}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  # Configuração do JPA/Hibernate
  jpa:
    open-in-view: false # a sessão do Hibernate não fica aberta até a view; tudo é resolvido no service
    hibernate:
      ddl-auto: validate # Como usamos Flyway, o Hibernate não cria tabelas, só valida se elas existem
    show-sql: ${SHOW_SQL:false} # ligue com SHOW_SQL=true para depurar as queries
    properties:
      hibernate:
        format_sql: true

  # Configuração do Flyway (para rodar os scripts SQL)
  flyway:
    enabled: true
    validate-migration-naming: true

# Origens liberadas no CORS (frontend). Separe várias por vírgula.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Configuração do Swagger (OpenAPI)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

# Configuração do Actuator (útil para o Healthcheck do Docker)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
